name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Smoke-test the binaries
        run: |
          cargo run --release --locked -p traffic_sign_recognition | tail -12
          cargo run --release --locked -p speed_limit_recognition -- --demo | tail -8
          cargo run --release --locked -p instrument_cluster -- --snapshot output/cluster.png --speed 66 --limit 50
          ./scripts/fetch-data.sh
          cargo run --release --locked -p adas_drive -- --duration 4 --output output/drive.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: output/
